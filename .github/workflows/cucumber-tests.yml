name: Cucumber Integration Tests

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:
    branches:
      - cucumber-test-workflow-2

concurrency:
  group: ${{ github.event.number || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Run hostname
      run: hostname

    - name: Fix host entry
      run: sudo echo "127.0.0.1 $(hostname)" | sudo tee -a /etc/hosts

    - name: Show hosts
      run: cat /etc/hosts

    - name: Checkout master
      uses: actions/checkout@v6

    - name: Cache Maven packages
      uses: actions/cache@v5
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2
        restore-keys: ${{ runner.os }}-m2

    - name: Set up JDK 21
      uses: actions/setup-java@v2
      with:
        java-version: 21
        distribution: 'temurin'

    - name: Build product-apim without tests
      run: mvn clean install --file all-in-one-apim/pom.xml -Dmaven.test.skip=true

    - name: Replace keystore files
      run: |
        ZIP_FILE="$GITHUB_WORKSPACE/all-in-one-apim/modules/p2-profile/product/target/wso2am-4.7.0-SNAPSHOT.zip"
        unzip -q "$ZIP_FILE" -d /tmp/apim-extract
        cp all-in-one-apim/modules/integration-v2/client-truststore.jks \
           all-in-one-apim/modules/integration-v2/wso2carbon.jks \
           /tmp/apim-extract/wso2am-4.7.0-SNAPSHOT/repository/resources/security/
        rm "$ZIP_FILE"
        cd /tmp/apim-extract && zip -qr "$ZIP_FILE" .

    - name: Run Cucumber Tests
      working-directory: all-in-one-apim/modules/integration-v2/
      run: |
        mvn clean install -Ddocker.extra.hosts="--add-host=host.docker.internal:host-gateway"
